name: Publish Python 🐍 distributions 📦 to PyPI and TestPyPI

on: push

permissions: {}

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.14 🐍🐍🐍
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install poetry
        run: |
          python -m pip install poetry
      - name: Install dependencies through Poetry
        run: |
          python -m poetry install --with dev
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: startsWith(github.event.ref, 'refs/tags')
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        if: startsWith(github.event.ref, 'refs/tags')
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Publish distribution 📦 to PyPI via OSS Exit Gate
        if: startsWith(github.event.ref, 'refs/tags')
        run: |
          python -m poetry build
          python -m poetry config repositories.exitgate "https://us-python.pkg.dev/oss-exit-gate-prod/cloud-forensics-utils--pypi/"
          python -m poetry publish -r exitgate -u oauth2accesstoken -p "$(gcloud auth print-access-token)"
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/cloud-forensics-utils/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
